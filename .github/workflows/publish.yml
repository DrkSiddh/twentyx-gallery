name: TwentyX sunrise / sunset publisher
on:
  schedule:
    # Two daylight-saving-aware candidates per period; local-time gate below.
    - cron: "17 1,2,13,14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artists.json"
      - "data/inbox.json"
      - "scripts/discover-free.mjs"
      - ".github/workflows/publish.yml"
permissions:
  contents: write
  issues: read
concurrency:
  group: twentyx-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pacific posting window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour=$(TZ=America/Los_Angeles date +%H)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ] || [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: '22'
      - name: Install free discovery browser and build tools
        if: steps.window.outputs.allowed == 'true'
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium --only-shell
      - name: Load verified removal requests
        if: steps.window.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" > "$RUNNER_TEMP/twentyx-approvals.json"
      - name: Apply verified removals before discovery
        if: steps.window.outputs.allowed == 'true'
        run: TWENTYX_APPROVALS_FILE="$RUNNER_TEMP/twentyx-approvals.json" node scripts/publish.mjs
      - name: Find and validate new TwentyX posts at no API cost
        if: steps.window.outputs.allowed == 'true'
        run: npm run discover:free
      - name: Validate and publish current exhibitions
        if: steps.window.outputs.allowed == 'true'
        run: npm run publish
      - name: Commit only changed gallery content
        if: steps.window.outputs.allowed == 'true'
        run: |
          git config user.name "TwentyX Gallery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html artists.json data/ ':(glob)@*/index.html'
          if [ -d welcome ] && [ -n "$(find welcome -type f -print -quit)" ]; then
            git add -A -- welcome/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified TwentyX collections"
            git push
          fi
