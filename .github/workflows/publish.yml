name: TwentyX sunrise / sunset publisher
on:
  schedule:
    # Two daylight-saving-aware candidates per period; local-time gate below.
    - cron: "17 1,2,13,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twentyx-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pacific posting window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour=$(TZ=America/Los_Angeles date +%H)
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$hour" = "06" ] || [ "$hour" = "18" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: '22'
      - name: Install QR renderer
        if: steps.window.outputs.allowed == 'true'
        run: npm install --no-package-lock --ignore-scripts
      - name: Validate, merge and publish without deletions
        if: steps.window.outputs.allowed == 'true'
        run: npm run publish
      - name: Commit only changed gallery content
        if: steps.window.outputs.allowed == 'true'
        run: |
          git config user.name "TwentyX Gallery Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artists.json data/collections.json data/manifest.json data/previous-posts.json welcome/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified TwentyX collections"
            git push
          fi
